
name: Extraire le site web

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Extraire le fichier ZIP
        run: |
          unzip -o benediction-charigufi-site-final.zip -d extracted
          cp -r extracted/. .
          rm -rf extracted

      - name: Enregistrer les fichiers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extraire le site web"
          git push
          
