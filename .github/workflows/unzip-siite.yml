name: Extract website

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract website
        run: |
          mkdir -p extracted
          unzip -o benediction-charigufi-site-final.zip -d extracted
          cp -r extracted/frontend .
          cp -r extracted/backend .
          cp extracted/README.txt . 2>/dev/null || true

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend backend README.txt
          git diff --cached --quiet || git commit -m "Extract website files"
          git push
